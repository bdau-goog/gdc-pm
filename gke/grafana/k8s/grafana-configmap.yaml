              "custom": { "lineWidth": 0, "fillOpacity": 85 },
              "mappings": [
                { "type": "value", "options": { "2": { "text": "AI Warning",  "color": "#FF9100", "index": 0 } } },
                { "type": "value", "options": { "3": { "text": "AI Critical", "color": "#FF1744", "index": 1 } } }
