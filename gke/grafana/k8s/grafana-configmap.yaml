---
# ============================================================================
# Grafana — Datasource Provisioning (AlloyDB Omni)
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: gdc-pm
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: AlloyDB-Omni
        type: postgres
        url: alloydb-omni.gdc-pm.svc.cluster.local:5432
        database: grid_reliability
        user: ${ALLOYDB_USER}
        secureJsonData:
          password: ${ALLOYDB_PASS}
        jsonData:
          sslmode: disable
          maxOpenConns: 10
          maxIdleConns: 5
          connMaxLifetime: 14400
          postgresVersion: 1500
          timescaledb: false
        isDefault: true
        editable: false

---
# ============================================================================
# Grafana — Dashboard Provisioning Config
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: gdc-pm
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: gdc-pm
        orgId: 1
        type: file
        disableDeletion: true
        updateIntervalSeconds: 10
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards

---
# ============================================================================
# Grafana — GDC-PM O&G Predictive Maintenance Dashboard JSON
# Phase 4.2 — fully aligned to ESP / Gas Lift / Mud Pump / Top Drive schema
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: gdc-pm
data:
  gdc-pm-dashboard.json: |
    {
      "title": "GDC-PM — O&G Predictive Maintenance",
      "uid": "gdc-pm-main",
      "tags": ["gdc", "predictive-maintenance", "oil-gas", "esp", "mud-pump"],
      "timezone": "browser",
      "refresh": "5s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [

        {
          "id": 20,
          "type": "table",
          "title": "🚨  Active Alerts — Unacknowledged Faults (Last Hour)",
          "description": "ML-detected faults not yet acknowledged by an operator. ESP gas_lock and Mud Pump dampener failures are immediate emergencies.",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 7 },
          "options": {
            "sortBy": [{ "desc": true, "displayName": "event_time" }],
            "cellHeight": "sm",
            "footer": { "show": false }
          },
          "fieldConfig": {
            "defaults": { "custom": { "displayMode": "auto", "inspect": false } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "event_time" },
                "properties": [{ "id": "displayName", "value": "Time" }, { "id": "custom.width", "value": 130 }] },
              { "matcher": { "id": "byName", "options": "asset_id" },
                "properties": [{ "id": "displayName", "value": "Asset" }, { "id": "custom.width", "value": 160 }] },
              { "matcher": { "id": "byName", "options": "predicted_label" },
                "properties": [
                  { "id": "displayName", "value": "ML Fault" },
                  { "id": "custom.width", "value": 200 },
                  { "id": "custom.displayMode", "value": "color-background" },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "red", "value": null }] } }
                ]},
              { "matcher": { "id": "byName", "options": "confidence" },
                "properties": [{ "id": "displayName", "value": "Confidence" }, { "id": "unit", "value": "percentunit" }, { "id": "custom.width", "value": 100 }] },
              { "matcher": { "id": "byName", "options": "psi" },
                "properties": [{ "id": "displayName", "value": "PSI" }, { "id": "custom.width", "value": 80 }] },
              { "matcher": { "id": "byName", "options": "temp_f" },
                "properties": [{ "id": "displayName", "value": "Temp °F" }, { "id": "custom.width", "value": 80 }] },
              { "matcher": { "id": "byName", "options": "vibration" },
                "properties": [{ "id": "displayName", "value": "Vib mm/s" }, { "id": "custom.width", "value": 80 }] },
              { "matcher": { "id": "byName", "options": "motor_amps" },
                "properties": [{ "id": "displayName", "value": "Amps" }, { "id": "custom.width", "value": 70 }] },
              { "matcher": { "id": "byName", "options": "spm" },
                "properties": [{ "id": "displayName", "value": "SPM" }, { "id": "custom.width", "value": 70 }] },
              { "matcher": { "id": "byName", "options": "recommended_action" },
                "properties": [{ "id": "displayName", "value": "Recommended Action" }] }
            ]
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT event_time, asset_id, predicted_label, ROUND(confidence::numeric, 3) AS confidence, psi, temp_f, vibration, motor_amps, spm, recommended_action FROM telemetry_events WHERE acknowledged = FALSE AND predicted_label != 'normal' AND event_time > NOW() - INTERVAL '1 hour' ORDER BY event_time DESC LIMIT 40",
              "format": "table"
            }
          ]
        },

        {
          "id": 21,
          "type": "stat",
          "title": "🔴  Critical Faults (30m)",
          "description": "gas_lock · valve_failure · pulsation_dampener_failure",
          "gridPos": { "x": 0, "y": 7, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "area", "textMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "red", "value": 1 }
              ]},
              "mappings": []
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT COUNT(*) as value FROM telemetry_events WHERE predicted_label IN ('gas_lock','valve_failure','pulsation_dampener_failure') AND event_time > NOW() - INTERVAL '30 minutes'",
              "format": "table"
            }
          ]
        },

        {
          "id": 22,
          "type": "stat",
          "title": "🟠  Warnings (30m)",
          "description": "sand_ingress · motor_overheat · thermal_runaway · bearing_wear · valve_washout · piston_seal_wear · gearbox_bearing_spalling · hydraulic_leak",
          "gridPos": { "x": 4, "y": 7, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "area", "textMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 1 }
              ]}
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT COUNT(*) as value FROM telemetry_events WHERE predicted_label IN ('sand_ingress','motor_overheat','thermal_runaway','bearing_wear','valve_washout','piston_seal_wear','gearbox_bearing_spalling','hydraulic_leak') AND event_time > NOW() - INTERVAL '30 minutes'",
              "format": "table"
            }
          ]
        },

        {
          "id": 23,
          "type": "stat",
          "title": "⏱  Mins Since Last Critical",
          "description": "Time since last gas_lock, valve_failure, or dampener rupture. Green >3h, red <15m.",
          "gridPos": { "x": 8, "y": 7, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "m",
              "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red",    "value": null },
                { "color": "orange", "value": 15 },
                { "color": "yellow", "value": 60 },
                { "color": "green",  "value": 180 }
              ]}
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT EXTRACT(EPOCH FROM (NOW() - MAX(event_time)))/60 AS value FROM telemetry_events WHERE predicted_label IN ('gas_lock','valve_failure','pulsation_dampener_failure')",
              "format": "table"
            }
          ]
        },

        {
          "id": 24,
          "type": "stat",
          "title": "🛢  Active Assets (5m)",
          "description": "Assets with at least one telemetry row in the last 5 minutes.",
          "gridPos": { "x": 12, "y": 7, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red",   "value": null },
                { "color": "orange","value": 5 },
                { "color": "green", "value": 10 }
              ]}
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT COUNT(DISTINCT asset_id) AS value FROM telemetry_events WHERE event_time > NOW() - INTERVAL '5 minutes'",
              "format": "table"
            }
          ]
        },

        {
          "id": 25,
          "type": "stat",
          "title": "Unacknowledged Alerts",
          "gridPos": { "x": 16, "y": 7, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 1 },
                { "color": "red", "value": 5 }
              ]}
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT COUNT(*) as value FROM telemetry_events WHERE acknowledged = FALSE AND predicted_label != 'normal' AND event_time > NOW() - INTERVAL '1 hour'",
              "format": "table"
            }
          ]
        },

        {
          "id": 26,
          "type": "stat",
          "title": "Anomaly Rate (30m)",
          "gridPos": { "x": 20, "y": 7, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green",  "value": null },
                { "color": "yellow", "value": 15 },
                { "color": "red",    "value": 30 }
              ]}
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT ROUND(100.0 * SUM(CASE WHEN predicted_label != 'normal' THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 1) AS value FROM telemetry_events WHERE event_time > NOW() - INTERVAL '30 minutes'",
              "format": "table"
            }
          ]
        },

        {
          "id": 9,
          "type": "state-timeline",
          "title": "Fleet Health Timeline — ESP · Gas Lift · Mud Pump · Top Drive",
          "description": "Green=Normal · Orange=Warning · Red=Critical. Covers all 15 O&G assets.",
          "gridPos": { "x": 0, "y": 11, "w": 24, "h": 7 },
          "options": {
            "mergeValues": true,
            "showValue": "never",
            "alignValue": "left",
            "rowHeight": 0.9,
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 0, "fillOpacity": 85 },
              "mappings": [
                { "type": "value", "options": { "2": { "text": "Warning",  "color": "#FF9100", "index": 0 } } },
                { "type": "value", "options": { "3": { "text": "Critical", "color": "#FF1744", "index": 1 } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "#00BFA5", "value": null } ] }
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT event_time AS time, asset_id AS metric, CASE predicted_label WHEN 'gas_lock'                   THEN 3 WHEN 'valve_failure'              THEN 3 WHEN 'pulsation_dampener_failure' THEN 3 WHEN 'sand_ingress'               THEN 2 WHEN 'motor_overheat'             THEN 2 WHEN 'thermal_runaway'            THEN 2 WHEN 'bearing_wear'               THEN 2 WHEN 'valve_washout'              THEN 2 WHEN 'piston_seal_wear'           THEN 2 WHEN 'gearbox_bearing_spalling'   THEN 2 WHEN 'hydraulic_leak'             THEN 2 ELSE NULL END AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND predicted_label != 'normal' ORDER BY event_time",
              "format": "time_series"
            }
          ]
        },

        {
          "id": 5,
          "type": "timeseries",
          "title": "ESP Intake Pressure (PSI)",
          "description": "Nominal 1,200–1,600 PSI. Below 800 PSI → Gas Lock risk. Above 1,800 PSI → check valves.",
          "gridPos": { "x": 0, "y": 18, "w": 8, "h": 8 },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": {
            "defaults": {
              "unit": "pressurepsi",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null }, { "color": "green", "value": 800 }, { "color": "yellow", "value": 1700 }, { "color": "red", "value": 1850 }
              ]},
              "custom": { "thresholdsStyle": { "mode": "line" } }
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT event_time AS time, asset_id AS metric, AVG(psi) AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND asset_id LIKE 'ESP-%' GROUP BY event_time, asset_id ORDER BY event_time",
              "format": "time_series"
            }
          ]
        },

        {
          "id": 31,
          "type": "timeseries",
          "title": "Gas Lift Discharge Pressure (PSI)",
          "description": "Nominal 940–1,060 PSI. Below 600 PSI → Check Valve Failure. Drop rate signals valve seat wear.",
          "gridPos": { "x": 8, "y": 18, "w": 8, "h": 8 },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": {
            "defaults": {
              "unit": "pressurepsi",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null }, { "color": "green", "value": 600 }, { "color": "yellow", "value": 1100 }, { "color": "red", "value": 1200 }
              ]},
              "custom": { "thresholdsStyle": { "mode": "line" } }
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT event_time AS time, asset_id AS metric, AVG(psi) AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND asset_id LIKE 'GLIFT-%' GROUP BY event_time, asset_id ORDER BY event_time",
              "format": "time_series"
            }
          ]
        },

        {
          "id": 32,
          "type": "timeseries",
          "title": "Mud Pump Discharge Pressure (PSI)",
          "description": "Nominal 2,550–3,150 PSI. High pressure spikes → Dampener Rupture. Slow decline → Valve Washout.",
          "gridPos": { "x": 16, "y": 18, "w": 8, "h": 8 },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": {
            "defaults": {
              "unit": "pressurepsi",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null }, { "color": "green", "value": 1800 }, { "color": "yellow", "value": 3300 }, { "color": "red", "value": 3800 }
              ]},
              "custom": { "thresholdsStyle": { "mode": "line" } }
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT event_time AS time, asset_id AS metric, AVG(psi) AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND asset_id LIKE 'MUD-%' GROUP BY event_time, asset_id ORDER BY event_time",
              "format": "time_series"
            }
          ]
        },

        {
          "id": 6,
          "type": "timeseries",
          "title": "Temperature °F — All Assets",
          "description": "ESP winding 180–220°F · Gas Lift 140–178°F · Mud Pump fluid 90–120°F · Top Drive gearbox 130–165°F",
          "gridPos": { "x": 0, "y": 26, "w": 12, "h": 8 },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": {
            "defaults": {
              "unit": "fahrenheit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "yellow", "value": 180 }, { "color": "red", "value": 230 }
              ]},
              "custom": { "lineWidth": 1, "fillOpacity": 5, "thresholdsStyle": { "mode": "line" } }
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT event_time AS time, asset_id AS metric, AVG(temp_f) AS value FROM telemetry_events WHERE $__timeFilter(event_time) GROUP BY event_time, asset_id ORDER BY event_time",
              "format": "time_series"
            }
          ]
        },

        {
          "id": 7,
          "type": "timeseries",
          "title": "Vibration mm/s — All Assets",
          "description": "ESP vib 0.8–2.0 mm/s · Gas Lift 1.0–2.5 · Mud Pump 2.5–4.5 · Top Drive 1.8–3.8. Rising vib = earliest fault precursor.",
          "gridPos": { "x": 12, "y": 26, "w": 12, "h": 8 },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": {
            "defaults": {
              "unit": "velocityms",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "yellow", "value": 5.0 }, { "color": "red", "value": 10.0 }
              ]},
              "custom": { "lineWidth": 1, "fillOpacity": 8, "thresholdsStyle": { "mode": "line" } }
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT event_time AS time, asset_id AS metric, AVG(vibration) AS value FROM telemetry_events WHERE $__timeFilter(event_time) GROUP BY event_time, asset_id ORDER BY event_time",
              "format": "time_series"
            }
          ]
        },

        {
          "id": 29,
          "type": "timeseries",
          "title": "Motor Current — ESP Assets (A)",
          "description": "Nominal 60–90 A. Overcurrent >105 A → Motor Overheat. Undercurrent <45 A → Gas Lock or Sand Erosion impeller loss.",
          "gridPos": { "x": 0, "y": 34, "w": 12, "h": 8 },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": {
            "defaults": {
              "unit": "amp",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red",    "value": null },
                { "color": "green",  "value": 45 },
                { "color": "yellow", "value": 95 },
                { "color": "red",    "value": 105 }
              ]},
              "custom": { "lineWidth": 1, "fillOpacity": 10, "thresholdsStyle": { "mode": "line" } }
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT event_time AS time, asset_id AS metric, AVG(motor_amps) AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND asset_id LIKE 'ESP-%' AND motor_amps IS NOT NULL GROUP BY event_time, asset_id ORDER BY event_time",
              "format": "time_series"
            }
          ]
        },

        {
          "id": 30,
          "type": "timeseries",
          "title": "Stroke Rate — Mud Pump Assets (SPM)",
          "description": "Nominal 75–100 SPM. Erratic / chaotic SPM → Pulsation Dampener Rupture (emergency). Declining SPM → Valve Washout or Seal Wear.",
          "gridPos": { "x": 12, "y": 34, "w": 12, "h": 8 },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "lineWidth": 1, "fillOpacity": 10, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red",    "value": null },
                { "color": "green",  "value": 60 },
                { "color": "yellow", "value": 110 },
                { "color": "red",    "value": 120 }
              ]}
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT event_time AS time, asset_id AS metric, AVG(spm) AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND asset_id LIKE 'MUD-%' AND spm IS NOT NULL GROUP BY event_time, asset_id ORDER BY event_time",
              "format": "time_series"
            }
          ]
        },

        {
          "id": 10,
          "type": "timeseries",
          "title": "ML Confidence — Failure Predictions Only",
          "description": "Confidence when the XGBoost model scores a non-normal prediction. Rising confidence = escalating certainty. V2 edge-calibrated model produces tighter, more stable trajectories than V1.",
          "gridPos": { "x": 0, "y": 42, "w": 12, "h": 8 },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0, "max": 1,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "#FFD600", "value": null }, { "color": "#FF9100", "value": 0.7 }, { "color": "#FF1744", "value": 0.9 }
              ]},
              "custom": { "lineWidth": 2, "fillOpacity": 15, "thresholdsStyle": { "mode": "line+area" } }
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT event_time AS time, asset_id AS metric, confidence AS value FROM telemetry_events WHERE predicted_label != 'normal' AND $__timeFilter(event_time) ORDER BY event_time",
              "format": "time_series"
            }
          ]
        },

        {
          "id": 11,
          "type": "timeseries",
          "title": "Anomaly Rate % — Hourly Trend (24h)",
          "description": "% of all scored readings flagged as failures per hour. Normally near 0%. Spikes = active fault injection or real degradation.",
          "gridPos": { "x": 12, "y": 42, "w": 12, "h": 8 },
          "options": { "tooltip": { "mode": "single" }, "legend": { "displayMode": "list", "placement": "bottom" } },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null }, { "color": "yellow", "value": 15 }, { "color": "red", "value": 30 }
              ]},
              "custom": { "lineWidth": 2, "fillOpacity": 20, "thresholdsStyle": { "mode": "line" } }
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT date_trunc('hour', event_time) AS time, 'Anomaly Rate' AS metric, ROUND(100.0 * SUM(CASE WHEN predicted_label != 'normal' THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 2) AS value FROM telemetry_events WHERE event_time > NOW() - INTERVAL '24 hours' GROUP BY 1 ORDER BY 1",
              "format": "time_series"
            }
          ]
        },

        {
          "id": 8,
          "type": "table",
          "title": "Recent ML Detections — Full Log",
          "description": "All telemetry events with ML predictions. Includes motor_amps (ESP) and spm (Mud Pump).",
          "gridPos": { "x": 0, "y": 50, "w": 24, "h": 8 },
          "options": { "sortBy": [{ "desc": true, "displayName": "event_time" }], "cellHeight": "sm" },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              { "matcher": { "id": "byName", "options": "predicted_label" },
                "properties": [
                  { "id": "custom.displayMode", "value": "color-background" },
                  { "id": "custom.width", "value": 180 },
