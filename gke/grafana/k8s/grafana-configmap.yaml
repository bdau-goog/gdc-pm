        {
          "id": 8,
          "type": "table",
          "title": "🔴 SCADA Hard-Threshold Breach Log",
          "description": "This table shows ONLY the events where sensor values physically crossed a hard SCADA alarm limit — what a traditional monitoring system would actually generate as alarms. During normal and early-stage fault development (when the Edge AI timeline above is already populated), this table is empty. That is the point: by the time this log fills up, the corrective maintenance window is already compressed.",
