          },
          "targets": [{
            "datasource": "AlloyDB-Omni",
            "rawSql": "SELECT event_time, asset_id, CASE WHEN asset_id LIKE 'ESP-%' AND psi < 800 THEN 'ESP PSI LOW (<800) — Gas Lock' WHEN asset_id LIKE 'ESP-%' AND psi > 1850 THEN 'ESP PSI HIGH (>1850)' WHEN asset_id LIKE 'ESP-%' AND motor_amps < 45 THEN 'ESP AMPS LOW (<45A) — Undercurrent' WHEN asset_id LIKE 'ESP-%' AND motor_amps > 105 THEN 'ESP AMPS HIGH (>105A) — Overcurrent' WHEN asset_id LIKE 'GLIFT-%' AND psi < 600 THEN 'GasLift PSI LOW (<600) — Valve Failure' WHEN asset_id LIKE 'GLIFT-%' AND psi > 1200 THEN 'GasLift PSI HIGH (>1200)' WHEN asset_id LIKE 'MUD-%' AND psi < 1800 THEN 'MudPump PSI LOW (<1800)' WHEN asset_id LIKE 'MUD-%' AND psi > 3800 THEN 'MudPump PSI HIGH (>3800) — Rupture Risk' WHEN asset_id LIKE 'MUD-%' AND spm < 60 THEN 'MudPump SPM LOW (<60) — Stall' WHEN asset_id LIKE 'MUD-%' AND spm > 120 THEN 'MudPump SPM HIGH (>120) — Runaway' WHEN temp_f > 230 THEN 'TEMP HIGH (>230°F) — Thermal Alarm' WHEN vibration > 10 THEN 'VIB HIGH (>10 mm/s) — Vibration Alarm' ELSE 'Threshold Breach' END AS alarm_type, psi, temp_f, vibration, motor_amps, spm FROM telemetry_events WHERE $__timeFilter(event_time) AND ('All' = '$asset' OR asset_id = '$asset') AND ((asset_id LIKE 'ESP-%' AND (psi < 800 OR psi > 1850 OR temp_f > 230 OR motor_amps > 105 OR motor_amps < 45 OR vibration > 10)) OR (asset_id LIKE 'GLIFT-%' AND (psi < 600 OR psi > 1200 OR temp_f > 230 OR vibration > 10)) OR (asset_id LIKE 'MUD-%' AND (psi < 1800 OR psi > 3800 OR spm > 120 OR spm < 60 OR vibration > 10)) OR (asset_id LIKE 'TOPDRIVE-%' AND (temp_f > 230 OR vibration > 10))) ORDER BY event_time DESC LIMIT 50",
            "format": "table"
          }]
        }

