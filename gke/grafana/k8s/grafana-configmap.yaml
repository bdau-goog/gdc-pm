            "rawSql": "SELECT date_trunc('minute', event_time) AS time, asset_id AS metric, MAX(CASE predicted_label WHEN 'gas_lock' THEN 3 WHEN 'valve_failure' THEN 3 WHEN 'pulsation_dampener_failure' THEN 3 WHEN 'sand_ingress' THEN 2 WHEN 'motor_overheat' THEN 2 WHEN 'thermal_runaway' THEN 2 WHEN 'bearing_wear' THEN 2 WHEN 'valve_washout' THEN 2 WHEN 'piston_seal_wear' THEN 2 WHEN 'gearbox_bearing_spalling' THEN 2 WHEN 'hydraulic_leak' THEN 2 ELSE NULL END) AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND predicted_label != 'normal' AND ('All' = '$asset' OR asset_id = '$asset') GROUP BY 1, asset_id ORDER BY 1",
