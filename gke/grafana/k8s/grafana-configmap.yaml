---
# ============================================================================
# Grafana — Datasource Provisioning (AlloyDB Omni)
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: gdc-pm
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: AlloyDB-Omni
        type: postgres
        url: alloydb-omni.gdc-pm.svc.cluster.local:5432
        database: grid_reliability
        user: ${ALLOYDB_USER}
        secureJsonData:
          password: ${ALLOYDB_PASS}
        jsonData:
          sslmode: disable
          maxOpenConns: 10
          maxIdleConns: 5
          connMaxLifetime: 14400
          postgresVersion: 1500
          timescaledb: false
        isDefault: true
        editable: false

---
# ============================================================================
# Grafana — Dashboard Provisioning Config
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: gdc-pm
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: gdc-pm
        orgId: 1
        type: file
        disableDeletion: true
        updateIntervalSeconds: 10
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards

---
# ============================================================================
# Grafana — GDC-PM O&G SCADA / Telemetry Monitoring Dashboard
# Phase 13.1 — Fixes: asset dropdown, hidden legends, SCADA-only alarm log,
#              maxDataPoints limiting, Edge AI Detection Timeline renamed.
#
# NARRATIVE: This is a well-designed, functional reactive SCADA monitoring view.
# The "Asset" dropdown lets the operator focus on any single asset.
# The sensor charts show the full 12-hour shift window with hard alarm limits.
# The SCADA Breach Log at the bottom fires ONLY when hard thresholds are crossed.
# During early-stage fault development — when the GDC Edge AI is already
# predicting failure — THIS DASHBOARD SHOWS NOTHING WRONG.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: gdc-pm
data:
  gdc-pm-dashboard.json: |
    {
      "title": "GDC-PM — O&G Asset Telemetry Monitor",
      "uid": "gdc-pm-main",
      "tags": ["gdc", "scada", "telemetry", "oil-gas"],
      "timezone": "browser",
      "refresh": "10s",
      "time": { "from": "now-8h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "asset",
            "label": "Asset",
            "type": "query",
            "datasource": "AlloyDB-Omni",
            "query": "SELECT DISTINCT asset_id FROM telemetry_events ORDER BY 1",
            "definition": "SELECT DISTINCT asset_id FROM telemetry_events ORDER BY 1",
            "refresh": 2,
            "includeAll": true,
            "allValue": "All",
            "multi": false,
            "regex": "",
            "sort": 1,
            "hide": 0,
            "current": {},
            "options": []
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "name": "SCADA Critical Alarms",
            "datasource": "AlloyDB-Omni",
            "enable": true,
            "hide": false,
            "iconColor": "red",
            "rawQuery": "SELECT event_time AS time, asset_id || ': ' || predicted_label AS text FROM telemetry_events WHERE predicted_label IN ('gas_lock','valve_failure','pulsation_dampener_failure') AND event_time > NOW() - INTERVAL '12 hours' ORDER BY event_time",
            "showIn": 0,
            "titleFormat": "SCADA ALARM"
          }
        ]
      },
      "panels": [

        {
          "id": 1,
          "type": "row",
          "title": "Fleet Status",
          "collapsed": false,
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 }
        },

        {
          "id": 21,
          "type": "stat",
          "title": "Active Assets (10m)",
          "description": "Assets reporting telemetry in the last 10 minutes.",
          "gridPos": { "x": 0, "y": 1, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null },
                { "color": "orange", "value": 8 },
                { "color": "green", "value": 12 }
              ]}
            }
          },
          "targets": [{ "datasource": "AlloyDB-Omni", "rawSql": "SELECT COUNT(DISTINCT asset_id) AS value FROM telemetry_events WHERE event_time > NOW() - INTERVAL '10 minutes'", "format": "table" }]
        },

        {
          "id": 22,
          "type": "stat",
          "title": "SCADA Hard-Limit Alarms (1h)",
          "description": "Count of readings where sensor values physically crossed a hard SCADA alarm threshold (PSI, temp, vibration limits) in the last hour. This is what a traditional monitoring system would catch. Zero = normal operations from SCADA's perspective.",
          "gridPos": { "x": 4, "y": 1, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "area", "textMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "red", "value": 1 }
              ]}
            }
          },
          "targets": [{
            "datasource": "AlloyDB-Omni",
            "rawSql": "SELECT COUNT(*) AS value FROM telemetry_events WHERE event_time > NOW() - INTERVAL '1 hour' AND ((asset_id LIKE 'ESP-%' AND (psi < 800 OR psi > 1850 OR temp_f > 230 OR motor_amps > 105 OR motor_amps < 45 OR vibration > 10)) OR (asset_id LIKE 'GLIFT-%' AND (psi < 600 OR psi > 1200 OR temp_f > 230 OR vibration > 10)) OR (asset_id LIKE 'MUD-%' AND (psi < 1800 OR psi > 3800 OR spm > 120 OR spm < 60 OR vibration > 10)) OR (asset_id LIKE 'TOPDRIVE-%' AND (temp_f > 230 OR vibration > 10)))",
            "format": "table"
          }]
        },

        {
          "id": 23,
          "type": "stat",
          "title": "Time Since Last Hard Alarm",
          "description": "Minutes since last SCADA hard-threshold breach across the fleet. Green = >3 hours (healthy). Red = <15 minutes (active emergency).",
          "gridPos": { "x": 8, "y": 1, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "m",
              "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red",    "value": null },
                { "color": "orange", "value": 15 },
                { "color": "yellow", "value": 60 },
                { "color": "green",  "value": 180 }
              ]}
            }
          },
          "targets": [{
            "datasource": "AlloyDB-Omni",
            "rawSql": "SELECT EXTRACT(EPOCH FROM (NOW() - MAX(event_time)))/60 AS value FROM telemetry_events WHERE (asset_id LIKE 'ESP-%' AND (psi < 800 OR psi > 1850 OR temp_f > 230 OR motor_amps > 105 OR motor_amps < 45 OR vibration > 10)) OR (asset_id LIKE 'GLIFT-%' AND (psi < 600 OR psi > 1200 OR temp_f > 230 OR vibration > 10)) OR (asset_id LIKE 'MUD-%' AND (psi < 1800 OR psi > 3800 OR spm > 120 OR spm < 60 OR vibration > 10)) OR (asset_id LIKE 'TOPDRIVE-%' AND (temp_f > 230 OR vibration > 10))",
            "format": "table"
          }]
        },

        {
          "id": 24,
          "type": "stat",
          "title": "Avg ESP Intake Pressure",
          "description": "Mean PSI across all ESP assets in last 10 min. Nominal 1,200–1,600 PSI. SCADA LOW alarm fires at 800 PSI.",
          "gridPos": { "x": 12, "y": 1, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["mean"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "pressurepsi",
              "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red",    "value": null },
                { "color": "orange", "value": 800 },
                { "color": "green",  "value": 1100 },
                { "color": "yellow", "value": 1700 },
                { "color": "red",    "value": 1850 }
              ]}
            }
          },
          "targets": [{ "datasource": "AlloyDB-Omni", "rawSql": "SELECT AVG(psi) AS value FROM telemetry_events WHERE asset_id LIKE 'ESP-%' AND event_time > NOW() - INTERVAL '10 minutes'", "format": "table" }]
        },

        {
          "id": 25,
          "type": "stat",
          "title": "Avg Gas Lift Discharge P",
          "description": "Mean PSI across Gas Lift assets. Nominal 940–1,060 PSI. SCADA LOW at 600 PSI.",
          "gridPos": { "x": 16, "y": 1, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["mean"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "pressurepsi",
              "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red",    "value": null },
                { "color": "orange", "value": 600 },
                { "color": "green",  "value": 850 },
                { "color": "yellow", "value": 1100 },
                { "color": "red",    "value": 1200 }
              ]}
            }
          },
          "targets": [{ "datasource": "AlloyDB-Omni", "rawSql": "SELECT AVG(psi) AS value FROM telemetry_events WHERE asset_id LIKE 'GLIFT-%' AND event_time > NOW() - INTERVAL '10 minutes'", "format": "table" }]
        },

        {
          "id": 26,
          "type": "stat",
          "title": "Avg Mud Pump Discharge P",
          "description": "Mean PSI across Mud Pump assets. Nominal 2,550–3,150 PSI. SCADA HIGH at 3,800 PSI.",
          "gridPos": { "x": 20, "y": 1, "w": 4, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["mean"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "pressurepsi",
              "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red",    "value": null },
                { "color": "orange", "value": 1800 },
                { "color": "green",  "value": 2400 },
                { "color": "yellow", "value": 3300 },
                { "color": "red",    "value": 3800 }
              ]}
            }
          },
          "targets": [{ "datasource": "AlloyDB-Omni", "rawSql": "SELECT AVG(psi) AS value FROM telemetry_events WHERE asset_id LIKE 'MUD-%' AND event_time > NOW() - INTERVAL '10 minutes'", "format": "table" }]
        },

        {
          "id": 2,
          "type": "row",
          "title": "Pressure",
          "collapsed": false,
          "gridPos": { "x": 0, "y": 5, "w": 24, "h": 1 }
        },

        {
          "id": 5,
          "type": "timeseries",
          "title": "ESP Intake Pressure (PSI)",
          "description": "Nominal 1,200–1,600 PSI.  ▼ SCADA LOW alarm: 800 PSI (Gas Lock).  ▲ SCADA HIGH alarm: 1,850 PSI. A gradual declining slope — the gas lock precursor the Edge AI detects — sits well above the 800 PSI threshold and looks completely normal on this chart.",
          "gridPos": { "x": 0, "y": 6, "w": 12, "h": 9 },
          "maxDataPoints": 200,
          "options": {
            "tooltip": { "mode": "multi", "sort": "none" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "pressurepsi",
              "custom": { "lineWidth": 2, "fillOpacity": 6, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red",    "value": null },
                { "color": "green",  "value": 800 },
                { "color": "green",  "value": 1100 },
                { "color": "yellow", "value": 1700 },
                { "color": "red",    "value": 1850 }
              ]}
            }
          },
          "targets": [{
            "datasource": "AlloyDB-Omni",
            "rawSql": "SELECT date_trunc('minute', event_time) AS time, asset_id AS metric, AVG(psi) AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND asset_id LIKE 'ESP-%' AND ('All' = '$asset' OR asset_id = '$asset') GROUP BY 1, asset_id ORDER BY 1",
            "format": "time_series"
          }]
        },

        {
          "id": 31,
          "type": "timeseries",
          "title": "Gas Lift Discharge Pressure (PSI)",
          "description": "Nominal 940–1,060 PSI.  ▼ SCADA LOW alarm: 600 PSI (Check Valve Failure). A slow rate-of-decline of −2 PSI/hr — the valve washout signature — is visible in this 12-hour view but sits far above the 600 PSI alarm limit. Hover to identify individual assets.",
          "gridPos": { "x": 12, "y": 6, "w": 12, "h": 9 },
          "maxDataPoints": 200,
          "options": {
            "tooltip": { "mode": "multi", "sort": "none" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "pressurepsi",
              "custom": { "lineWidth": 2, "fillOpacity": 6, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red",    "value": null },
                { "color": "green",  "value": 600 },
                { "color": "green",  "value": 900 },
                { "color": "yellow", "value": 1100 },
                { "color": "red",    "value": 1200 }
              ]}
            }
          },
          "targets": [{
            "datasource": "AlloyDB-Omni",
            "rawSql": "SELECT date_trunc('minute', event_time) AS time, asset_id AS metric, AVG(psi) AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND asset_id LIKE 'GLIFT-%' AND ('All' = '$asset' OR asset_id = '$asset') GROUP BY 1, asset_id ORDER BY 1",
            "format": "time_series"
          }]
        },

        {
          "id": 3,
          "type": "row",
          "title": "Vibration & Temperature",
          "collapsed": false,
          "gridPos": { "x": 0, "y": 15, "w": 24, "h": 1 }
        },

        {
          "id": 71,
          "type": "timeseries",
          "title": "Vibration (mm/s) — ESP",
          "description": "ESP assets (Pad Alpha). Nominal 0.8–2.0 mm/s. SCADA HIGH: 10.0 mm/s. Sand ingress or gas lock causes a slow +0.05 mm/s/hr rise — invisible to SCADA until 10.0 is crossed weeks later.",
          "gridPos": { "x": 0, "y": 16, "w": 8, "h": 9 },
          "maxDataPoints": 200,
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "velocityms",
              "custom": { "lineWidth": 2, "fillOpacity": 5, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green",  "value": null },
                { "color": "yellow", "value": 5.0 },
                { "color": "red",    "value": 10.0 }
              ]}
            }
          },
          "targets": [{
            "datasource": "AlloyDB-Omni",
            "rawSql": "SELECT date_trunc('minute', event_time) AS time, asset_id AS metric, AVG(vibration) AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND asset_id LIKE 'ESP-%' AND ('All' = '$asset' OR asset_id = '$asset') GROUP BY 1, asset_id ORDER BY 1",
            "format": "time_series"
          }]
        },

        {
          "id": 72,
          "type": "timeseries",
          "title": "Vibration (mm/s) — Gas Lift",
          "description": "Gas Lift compressors (Pad Bravo). Nominal 1.0–2.5 mm/s. SCADA HIGH: 10.0 mm/s. Bearing wear shows a +0.08g/week BPFI spectral rise that is invisible here until overall vibration alarms.",
          "gridPos": { "x": 8, "y": 16, "w": 8, "h": 9 },
          "maxDataPoints": 200,
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "velocityms",
              "custom": { "lineWidth": 2, "fillOpacity": 5, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green",  "value": null },
                { "color": "yellow", "value": 7.0 },
                { "color": "red",    "value": 12.0 }
              ]}
            }
          },
          "targets": [{
            "datasource": "AlloyDB-Omni",
            "rawSql": "SELECT date_trunc('minute', event_time) AS time, asset_id AS metric, AVG(vibration) AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND asset_id LIKE 'GLIFT-%' AND ('All' = '$asset' OR asset_id = '$asset') GROUP BY 1, asset_id ORDER BY 1",
            "format": "time_series"
          }]
        },

        {
          "id": 73,
          "type": "timeseries",
          "title": "Vibration (mm/s) — Rig 42",
          "description": "Rig 42: Mud Pumps (nominal 2.5–4.5 mm/s, SCADA HIGH 20 mm/s) and Top Drive (nominal 1.8–3.8 mm/s, SCADA HIGH 15 mm/s). Pulsation dampener failure spikes instantly to 15–28 mm/s.",
          "gridPos": { "x": 16, "y": 16, "w": 8, "h": 9 },
          "maxDataPoints": 200,
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "velocityms",
              "custom": { "lineWidth": 2, "fillOpacity": 5, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green",  "value": null },
                { "color": "yellow", "value": 10.0 },
                { "color": "red",    "value": 20.0 }
              ]}
            }
          },
          "targets": [{
            "datasource": "AlloyDB-Omni",
            "rawSql": "SELECT date_trunc('minute', event_time) AS time, asset_id AS metric, AVG(vibration) AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND (asset_id LIKE 'MUD-%' OR asset_id LIKE 'TOPDRIVE-%') AND ('All' = '$asset' OR asset_id = '$asset') GROUP BY 1, asset_id ORDER BY 1",
            "format": "time_series"
          }]
        },

        {
          "id": 61,
          "type": "timeseries",
          "title": "Temperature (°F) — ESP",
          "description": "ESP motor winding temp (Pad Alpha). Nominal 180–220°F. SCADA HIGH: 230°F. At 67% water cut, cooling degrades — a +1°F/hr thermal climb reaches the alarm 50+ hours after GDC AI first detects it.",
          "gridPos": { "x": 0, "y": 25, "w": 8, "h": 9 },
          "maxDataPoints": 200,
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "fahrenheit",
              "custom": { "lineWidth": 2, "fillOpacity": 5, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green",  "value": null },
                { "color": "yellow", "value": 220 },
                { "color": "red",    "value": 280 }
              ]}
            }
          },
          "targets": [{
            "datasource": "AlloyDB-Omni",
            "rawSql": "SELECT date_trunc('minute', event_time) AS time, asset_id AS metric, AVG(temp_f) AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND asset_id LIKE 'ESP-%' AND ('All' = '$asset' OR asset_id = '$asset') GROUP BY 1, asset_id ORDER BY 1",
            "format": "time_series"
          }]
        },

        {
          "id": 62,
          "type": "timeseries",
          "title": "Temperature (°F) — Gas Lift",
          "description": "Gas Lift discharge temp (Pad Bravo). Nominal 140–178°F. SCADA HIGH: 230°F. Thermal runaway from blocked fin-fan cooling climbs +2.1°F/hr — GDC AI detects it 8 hours before the SCADA alarm.",
          "gridPos": { "x": 8, "y": 25, "w": 8, "h": 9 },
          "maxDataPoints": 200,
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "fahrenheit",
              "custom": { "lineWidth": 2, "fillOpacity": 5, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green",  "value": null },
                { "color": "yellow", "value": 190 },
                { "color": "red",    "value": 230 }
              ]}
            }
          },
          "targets": [{
            "datasource": "AlloyDB-Omni",
            "rawSql": "SELECT date_trunc('minute', event_time) AS time, asset_id AS metric, AVG(temp_f) AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND asset_id LIKE 'GLIFT-%' AND ('All' = '$asset' OR asset_id = '$asset') GROUP BY 1, asset_id ORDER BY 1",
            "format": "time_series"
          }]
        },

        {
          "id": 63,
          "type": "timeseries",
          "title": "Temperature (°F) — Rig 42",
          "description": "Rig 42 temps: Mud Pump fluid end (nominal 90–120°F, SCADA HIGH 180°F) and Top Drive gearbox oil (nominal 130–165°F, SCADA HIGH 220°F). Piston seal wear drives fluid end +8°F/hr.",
          "gridPos": { "x": 16, "y": 25, "w": 8, "h": 9 },
          "maxDataPoints": 200,
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "fahrenheit",
              "custom": { "lineWidth": 2, "fillOpacity": 5, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green",  "value": null },
                { "color": "yellow", "value": 150 },
                { "color": "red",    "value": 220 }
              ]}
            }
          },
          "targets": [{
            "datasource": "AlloyDB-Omni",
            "rawSql": "SELECT date_trunc('minute', event_time) AS time, asset_id AS metric, AVG(temp_f) AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND (asset_id LIKE 'MUD-%' OR asset_id LIKE 'TOPDRIVE-%') AND ('All' = '$asset' OR asset_id = '$asset') GROUP BY 1, asset_id ORDER BY 1",
            "format": "time_series"
          }]
        },

        {
          "id": 4,
          "type": "row",
          "title": "Electrical & Mechanical",
          "collapsed": false,
          "gridPos": { "x": 0, "y": 34, "w": 24, "h": 1 }
        },

        {
          "id": 29,
          "type": "timeseries",
          "title": "Motor Current — ESP Assets (A)",
          "description": "Nominal 60–90 A.  ▲ SCADA HIGH: >105 A (Motor Overheat).  ▼ SCADA LOW: <45 A (Gas Lock or sand impeller erosion). A moderate current drop from 82 A to 74 A combined with rising vibration is the early Gas Lock precursor — no single SCADA threshold is breached.",
          "gridPos": { "x": 0, "y": 35, "w": 12, "h": 9 },
          "maxDataPoints": 200,
          "options": {
            "tooltip": { "mode": "multi", "sort": "none" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "amp",
              "custom": { "lineWidth": 2, "fillOpacity": 8, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red",    "value": null },
                { "color": "green",  "value": 45 },
                { "color": "green",  "value": 55 },
                { "color": "yellow", "value": 95 },
                { "color": "red",    "value": 105 }
              ]}
            }
          },
          "targets": [{
            "datasource": "AlloyDB-Omni",
            "rawSql": "SELECT date_trunc('minute', event_time) AS time, asset_id AS metric, AVG(motor_amps) AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND asset_id LIKE 'ESP-%' AND ('All' = '$asset' OR asset_id = '$asset') AND motor_amps IS NOT NULL GROUP BY 1, asset_id ORDER BY 1",
            "format": "time_series"
          }]
        },

        {
          "id": 30,
          "type": "timeseries",
          "title": "Stroke Rate — Mud Pump Assets (SPM)",
          "description": "Nominal 75–100 SPM.  ▲ SCADA HIGH: >120 SPM.  ▼ SCADA LOW: <60 SPM. A gradual SPM decline from 92 to 84 SPM combined with rising discharge pressure indicates Valve Seat Washout — no SCADA threshold is breached at this stage.",
          "gridPos": { "x": 12, "y": 35, "w": 12, "h": 9 },
