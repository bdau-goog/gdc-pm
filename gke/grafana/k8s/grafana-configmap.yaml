          "targets": [{
            "datasource": "AlloyDB-Omni",
            "rawSql": "SELECT date_trunc('minute', event_time) AS time, asset_id AS metric, AVG(spm) AS value FROM telemetry_events WHERE $__timeFilter(event_time) AND asset_id LIKE 'MUD-%' AND ('All' = '$asset' OR asset_id = '$asset') AND spm IS NOT NULL GROUP BY 1, asset_id ORDER BY 1",
