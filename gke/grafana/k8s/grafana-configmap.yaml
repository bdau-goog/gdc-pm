---
# ============================================================================
# Grafana — Datasource Provisioning (AlloyDB Omni)
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: gdc-pm
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: AlloyDB-Omni
        type: postgres
        url: alloydb-omni.gdc-pm.svc.cluster.local:5432
        database: grid_reliability
        user: ${ALLOYDB_USER}
        secureJsonData:
          password: ${ALLOYDB_PASS}
        jsonData:
          sslmode: disable
          maxOpenConns: 10
          maxIdleConns: 5
          connMaxLifetime: 14400
          postgresVersion: 1500
          timescaledb: false
        isDefault: true
        editable: false

---
# ============================================================================
# Grafana — Dashboard Provisioning Config
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: gdc-pm
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: gdc-pm
        orgId: 1
        type: file
        disableDeletion: true
        updateIntervalSeconds: 10
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards

---
# ============================================================================
# Grafana — GDC-PM O&G SCADA / Telemetry Monitoring Dashboard
# Session 9 — Site-Zone Grouping: Pad Alpha, Pad Bravo, Rig 42
#
# NARRATIVE: Restructured from sensor-type columns to operator-centric
# site-zone grouping. Each row now represents a physical operational area:
#   Pad Alpha (ESP Production): PSI, Temp, Amps, Vibration
#   Pad Bravo (Gas Lift):       PSI, Temp, Vibration
#   Rig 42 (Drilling):          Mud PSI, SPM, Temp, Vibration
# During early-stage fault development, THIS DASHBOARD SHOWS NOTHING WRONG.
# The Edge AI vs SCADA comparison section at the bottom shows the contrast.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: gdc-pm
data:
  gdc-pm-dashboard.json: |
    {
      "title": "GDC-PM \u2014 O&G Asset Telemetry Monitor",
      "uid": "gdc-pm-main",
      "tags": [
        "gdc",
        "scada",
        "telemetry",
        "oil-gas"
      ],
      "timezone": "browser",
      "refresh": "10s",
      "time": {
        "from": "now-2h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "asset",
            "label": "Asset",
            "type": "query",
            "datasource": "AlloyDB-Omni",
            "query": "SELECT DISTINCT asset_id FROM telemetry_events ORDER BY 1",
            "definition": "SELECT DISTINCT asset_id FROM telemetry_events ORDER BY 1",
            "refresh": 2,
            "includeAll": true,
            "allValue": "All",
            "multi": false,
            "regex": "",
            "sort": 1,
            "hide": 0,
            "current": {},
            "options": []
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "name": "SCADA Critical Alarms",
            "datasource": "AlloyDB-Omni",
            "enable": true,
            "hide": false,
            "iconColor": "red",
            "rawQuery": "SELECT event_time AS time, asset_id || ': ' || predicted_label AS text FROM telemetry_events WHERE predicted_label IN ('gas_lock','valve_failure','pulsation_dampener_failure') AND event_time > NOW() - INTERVAL '12 hours' ORDER BY event_time",
            "showIn": 0,
            "titleFormat": "SCADA ALARM"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Fleet Status",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          }
        },
        {
          "id": 21,
          "type": "stat",
          "title": "Active Assets (10m)",
          "description": "Assets reporting telemetry in the last 10 minutes.",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 8
                  },
                  {
                    "color": "green",
                    "value": 12
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT COUNT(DISTINCT asset_id) AS value FROM telemetry_events WHERE event_time > NOW() - INTERVAL '10 minutes'",
              "format": "table"
            }
          ]
        },
        {
          "id": 22,
          "type": "stat",
          "title": "SCADA Hard-Limit Alarms (1h)",
          "description": "Count of readings where sensor values physically crossed a hard SCADA alarm threshold (PSI, temp, vibration limits) in the last hour. This is what a traditional monitoring system would catch. Zero = normal operations from SCADA's perspective.",
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT COUNT(*) AS value FROM telemetry_events WHERE event_time > NOW() - INTERVAL '1 hour' AND ((asset_id LIKE 'ESP-%' AND (psi < 800 OR psi > 1850 OR temp_f > 230 OR motor_amps > 105 OR motor_amps < 45 OR vibration > 10)) OR (asset_id LIKE 'GLIFT-%' AND (psi < 600 OR psi > 1200 OR temp_f > 230 OR vibration > 10)) OR (asset_id LIKE 'MUD-%' AND (psi < 1800 OR psi > 3800 OR spm > 120 OR spm < 60 OR vibration > 10)) OR (asset_id LIKE 'TOPDRIVE-%' AND (temp_f > 230 OR vibration > 10)))",
              "format": "table"
            }
          ]
        },
        {
          "id": 23,
          "type": "stat",
          "title": "Time Since Last Hard Alarm",
          "description": "Minutes since last SCADA hard-threshold breach across the fleet. Green = >3 hours (healthy). Red = <15 minutes (active emergency).",
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "m",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 15
                  },
                  {
                    "color": "yellow",
                    "value": 60
                  },
                  {
                    "color": "green",
                    "value": 180
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "datasource": "AlloyDB-Omni",
              "rawSql": "SELECT EXTRACT(EPOCH FROM (NOW() - MAX(event_time)))/60 AS value FROM telemetry_events WHERE (asset_id LIKE 'ESP-%' AND (psi < 800 OR psi > 1850 OR temp_f > 230 OR motor_amps > 105 OR motor_amps < 45 OR vibration > 10)) OR (asset_id LIKE 'GLIFT-%' AND (psi < 600 OR psi > 1200 OR temp_f > 230 OR vibration > 10)) OR (asset_id LIKE 'MUD-%' AND (psi < 1800 OR psi > 3800 OR spm > 120 OR spm < 60 OR vibration > 10)) OR (asset_id LIKE 'TOPDRIVE-%' AND (temp_f > 230 OR vibration > 10))",
              "format": "table"
            }
          ]
        },
