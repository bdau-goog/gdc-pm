              { "matcher": { "id": "byName", "options": "temp_f" },
                "properties": [{ "id": "displayName", "value": "Temp °F" }, { "id": "custom.width", "value": 75 }] },
              { "matcher": { "id": "byName", "options": "vibration" },
                "properties": [{ "id": "displayName", "value": "Vib mm/s" }, { "id": "custom.width", "value": 80 }] },
              { "matcher": { "id": "byName", "options": "motor_amps" },
