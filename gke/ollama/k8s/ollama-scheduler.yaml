# every weekday morning at 06:00 UTC, provisioning a T4 GPU node and
# accumulating charges while the developer was asleep. Deleted via:
#   kubectl delete cronjob ollama-stand-up ollama-stand-down -n gdc-pm
#
# CORRECT GPU DISCIPLINE:
