---
# ============================================================================
# Ollama LLM Inference Server
# GPU-accelerated pod running gemma4:latest for disconnected Edge AI RAG pipeline.
#
# Cluster: GKE Autopilot (us-central1) + NVIDIA T4 GPU (~$0.35/hr, scale-to-zero)
# T4 has 16GB VRAM — sufficient for gemma4:latest at Q4_K_M quantization.
# Autopilot provisions the GPU node automatically when replicas=1 is requested
# and deprovisions it automatically when replicas=0 — no manual node-pool resize.
#
# Portable design — works on GKE AND GDC Software-Only:
#   - PVC uses the cluster's default StorageClass (no GKE-specific class).
#   - GPU scheduling uses only the standard nvidia.com/gpu resource request.
#     On GDC Software-Only, install the NVIDIA GPU Operator; it will label
#     GPU nodes with nvidia.com/gpu.present="true" automatically.
#
# STORAGE NOTE: gemma4:latest Q4_K_M model is ~10-15GB. This PVC requests 50Gi.
#   If upgrading from an existing 10Gi PVC, resize or delete/recreate:
#     kubectl patch pvc ollama-models-pvc -n gdc-pm -p '{"spec":{"resources":{"requests":{"storage":"50Gi"}}}}'
#   (only works if the StorageClass supports volume expansion)
#
# GPU BILLING: Use ./scripts/gpu-start.sh and ./scripts/gpu-stop.sh to
#   scale replicas 0↔1. Autopilot handles node lifecycle automatically.
#   Always pair start with stop — never leave at replicas=1 overnight.
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: gdc-pm
spec:
  accessModes:
    - ReadWriteOnce
  # No storageClassName set — uses the cluster's default StorageClass.
  # On GKE this will be "standard-rwo" (GCE PD).
  # On GDC Software-Only set this to your provisioned StorageClass.
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: gdc-pm
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # GKE Autopilot: target T4 GPU class (16GB VRAM, Turing architecture).
      # T4 handles gemma4:latest Q4_K_M with adequate headroom for RAG context.
      # For GDC Software-Only with A100s, comment out this nodeSelector entirely.
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-tesla-t4

      # ── Init container: pull model before the server starts ───────────────
      # gemma4:latest Q4_K_M is ~10-15GB — first pull takes 5–15 minutes
      # depending on network. Model is persisted to PVC; subsequent restarts skip pull.
      #
      # For air-gapped GDC Software-Only deployments, see options in the
      # original ollama.yaml comments (pre-pull via PVC, custom image, etc.).
      initContainers:
        - name: pull-model
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              # Skip pull if model already exists on the PVC
              if ollama list 2>/dev/null | grep -q "gemma4:latest"; then
                echo "✅ gemma4:latest already present on PVC — skipping pull"
                exit 0
              fi
              echo "Starting Ollama server temporarily to pull model..."
              ollama serve &
              OLLAMA_PID=$!
              # Wait for server to be ready
              for i in $(seq 1 30); do
                if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
                  echo "Server ready after ${i}s"
                  break
                fi
                sleep 2
              done
              echo "Pulling gemma4:latest (~17GB) — this may take several minutes..."
              ollama pull gemma4:latest
              echo "✅ Model pulled successfully — stopping temporary server"
              kill $OLLAMA_PID
              wait $OLLAMA_PID 2>/dev/null || true
          env:
            - name: OLLAMA_MODELS
              value: /root/.ollama
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "8Gi"
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama

      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_MODELS
              value: /root/.ollama
            # Keep context window large enough for multi-turn RAG conversations
            - name: OLLAMA_NUM_CTX
              value: "8192"
            # T4 has tensor cores — enable flash attention for faster inference
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
          resources:
            requests:
              memory: "12Gi"
              cpu: "4000m"
              nvidia.com/gpu: 1
            limits:
              memory: "16Gi"
              cpu: "8000m"
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12   # Allow up to 2 min for model to be ready
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama

      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: gdc-pm
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - protocol: TCP
      port: 11434
      targetPort: 11434
      name: http
