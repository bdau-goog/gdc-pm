---
# ============================================================================
# Ollama LLM Inference Server
# GPU-accelerated pod running Gemma 4:27B for disconnected Edge AI RAG pipeline.
#
# Phase 14 upgrade: gemma:2b (A2) → gemma:27b (L4).
# L4 has 24GB VRAM — sufficient for gemma:27b at Q4_K_M quantization (~17GB).
#
# Portable design — works on GKE AND GDC Software-Only:
#   - PVC uses the cluster's default StorageClass (no GKE-specific class).
#   - GPU scheduling uses only the standard nvidia.com/gpu resource request.
#     On GDC Software-Only, install the NVIDIA GPU Operator; it will label
#     GPU nodes with nvidia.com/gpu.present="true" automatically.
#
# STORAGE NOTE: gemma:27b Q4_K_M model is ~15GB. This PVC requests 50Gi.
#   If upgrading from an existing 10Gi PVC, resize or delete/recreate:
#     kubectl patch pvc ollama-models-pvc -n gdc-pm -p '{"spec":{"resources":{"requests":{"storage":"50Gi"}}}}'
#   (only works if the StorageClass supports volume expansion)
#
# SCHEDULER NOTE: The ollama-scheduler.yaml CronJobs manage automatic
#   stand-up (6 AM UTC Mon–Fri) and stand-down (6 PM UTC daily) to avoid
#   L4 GPU charges during off-hours.
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  namespace: gdc-pm
spec:
  accessModes:
    - ReadWriteOnce
  # No storageClassName set — uses the cluster's default StorageClass.
  # On GKE this will be "standard-rwo" (GCE PD).
  # On GDC Software-Only set this to your provisioned StorageClass.
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: gdc-pm
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # GKE: target L4 GPU node pool (24GB VRAM, Ada Lovelace architecture).
      # L4 handles gemma:27b Q4_K_M (~17GB VRAM) with 7GB headroom for context.
      # For GDC Software-Only with A100s, comment out this nodeSelector entirely.
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"

      # ── Init container: pull model before the server starts ───────────────
      # gemma:27b Q4_K_M is ~15GB — first pull takes 5–15 minutes depending
      # on network. Model is persisted to PVC; subsequent restarts skip pull.
      #
      # For air-gapped GDC Software-Only deployments, see options in the
      # original ollama.yaml comments (pre-pull via PVC, custom image, etc.).
      initContainers:
        - name: pull-model
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              # Skip pull if model already exists on the PVC
              if ollama list 2>/dev/null | grep -q "gemma:27b"; then
                echo "✅ gemma:27b already present on PVC — skipping pull"
                exit 0
              fi
              echo "Starting Ollama server temporarily to pull model..."
              ollama serve &
              OLLAMA_PID=$!
              # Wait for server to be ready
              for i in $(seq 1 30); do
                if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
                  echo "Server ready after ${i}s"
                  break
                fi
                sleep 2
              done
              echo "Pulling gemma:27b (Q4_K_M, ~15GB) — this may take several minutes..."
              ollama pull gemma:27b
              echo "✅ Model pulled successfully — stopping temporary server"
              kill $OLLAMA_PID
              wait $OLLAMA_PID 2>/dev/null || true
          env:
            - name: OLLAMA_MODELS
              value: /root/.ollama
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "8Gi"
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama

      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_MODELS
              value: /root/.ollama
            # Keep context window large enough for multi-turn RAG conversations
            - name: OLLAMA_NUM_CTX
              value: "8192"
            # L4 has tensor cores — enable flash attention for faster inference
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
          resources:
            requests:
              memory: "12Gi"
              cpu: "4000m"
              nvidia.com/gpu: 1
            limits:
              memory: "26Gi"
              cpu: "8000m"
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12   # Allow up to 2 min for model to be ready
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama

      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: gdc-pm
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - protocol: TCP
      port: 11434
      targetPort: 11434
      name: http
